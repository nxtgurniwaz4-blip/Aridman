workflows:
  ios-native:
    name: Aridman’s Happy Place — iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "AridmansHappyPlace.xcodeproj"
        XCODE_SCHEME: "AridmansHappyPlace"
        # 🔑 Hardcoded password for your public cert.p12
        CERT_PASSWORD: "Mantappu"
    scripts:
      - name: Extract App Source Folders
        script: |
          echo "Scanning directory to unpack your main app archive..."
          APP_ZIP=$(find "$CM_BUILD_DIR" -maxdepth 1 -name "Aridmans-Happy-Place*" | head -n 1)
          if [ -z "$APP_ZIP" ]; then
            echo "ERROR: Could not locate the app archive!"
            exit 1
          fi
          unzip -o "$APP_ZIP" "AridmansHappyPlace/*" -d "$CM_BUILD_DIR/"

      - name: Auto-Detect Bundle ID and Install Project Specs
        script: |
          echo "Reading bundle identifier directly from profile.mobileprovision..."
          
          # Extracts the true public bundle ID directly from the binary data
          EXTRACTED_ID=$(security cms -D -i "$CM_BUILD_DIR/profile.mobileprovision" | plutil -extract Entitlements.application-identifier xml1 -o - - | grep string | sed 's/^<string>[^\. ]*\.\(.*\)<\/string>$/\1/g' | xargs)
          echo "DETECTED BUNDLE ID: $EXTRACTED_ID"
          
          # Automatically extract the hidden Development Team ID from the profile
          EXTRACTED_TEAM=$(security cms -D -i "$CM_BUILD_DIR/profile.mobileprovision" | plutil -extract TeamIdentifier xml1 -o - - | grep string | sed 's/^<string>\(.*\)<\/string>$/\1/g' | xargs)
          echo "DETECTED DEVELOPMENT TEAM ID: $EXTRACTED_TEAM"
          
          # Saves them globally for Codemagic and Xcode builds
          echo "export BUNDLE_ID=\"$EXTRACTED_ID\"" >> $CM_ENV
          echo "export DEVELOPMENT_TEAM=\"$EXTRACTED_TEAM\"" >> $CM_ENV
          
          # Force project.yml to use the correct bundle identifier automatically
          if [ -f "$CM_BUILD_DIR/project.yml" ]; then
            echo "Updating project.yml target identifier strings..."
            sed -i '' "s/com.aridman.happyplace/$EXTRACTED_ID/g" "$CM_BUILD_DIR/project.yml"
          fi

      - name: Install project generator
        script: |
          echo "Configuring homebrew shell paths for Apple Silicon environment..."
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          echo "Registering homebrew variables to locate binary tools..."
          eval "$(/opt/homebrew/bin/brew shellenv)"
          xcodegen generate --spec project.yml

      - name: Inject Public Certificate into Mac Keychain
        script: |
          echo "Setting up temporary secure build keychain..."
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          
          echo "Importing certificate data into runner identities..."
          security import "$CM_BUILD_DIR/cert.p12" \
            -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
            
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          
          echo "Linking mobileprovision profile to system storage paths..."
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$CM_BUILD_DIR/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          
          echo "Manual code-signing setup completed successfully!"

      # --- FIXED STEP: Explicitly overrides Team ID and enforces the profile mapping ---
      - name: Build Signed IPA File
        script: |
          echo "Compiling workspace archive with explicit Team credentials..."
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/Aridman.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            clean archive
          
          echo "Generating automated inline ExportOptions config template..."
          cat <<EOF > "$CM_BUILD_DIR/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
              <key>teamID</key>
              <string>$DEVELOPMENT_TEAM</string>
          </dict>
          </plist>
          EOF
          
          echo "Exporting compiled archive to direct standalone package..."
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/Aridman.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist"
            
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
