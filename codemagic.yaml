workflows:
  ios-native:
    name: Aridman’s Happy Place — iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "AridmansHappyPlace.xcodeproj"
        XCODE_SCHEME: "AridmansHappyPlace"
    scripts:
      - name: Extract App Source Folders
        script: |
          echo "Scanning directory to unpack your main app archive..."
          APP_ZIP=$(find "$CM_BUILD_DIR" -maxdepth 1 -name "Aridmans-Happy-Place*" | head -n 1)
          if [ -z "$APP_ZIP" ]; then
            echo "ERROR: Could not locate the app archive!"
            exit 1
          fi
          unzip -o "$APP_ZIP" "AridmansHappyPlace/*" -d "$CM_BUILD_DIR/"

      - name: Install project generator
        script: |
          echo "Configuring homebrew shell paths for Apple Silicon environment..."
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          echo "Registering homebrew variables to locate binary tools..."
          eval "$(/opt/homebrew/bin/brew shellenv)"
          xcodegen generate --spec project.yml

      # --- FIXED STEP: Bypasses keychain entirely, compiles raw binary for DNS install ---
      - name: Build Signed IPA File
        script: |
          echo "Extracting bundle identifier directly from profile.mobileprovision..."
          LOCAL_BUNDLE_ID=$(security cms -D -i "$CM_BUILD_DIR/profile.mobileprovision" | plutil -extract Entitlements.application-identifier xml1 -o - - | grep string | sed 's/^<string>[^\. ]*\.\(.*\)<\/string>$/\1/g' | xargs)
          
          # Fallback to default if profile read fails due to encoding
          if [ -z "$LOCAL_BUNDLE_ID" ]; then
            LOCAL_BUNDLE_ID="hk.com.hsbc.enterprise.hsbchkrewards.local2"
          fi
          echo "USING BUNDLE ID: $LOCAL_BUNDLE_ID"

          echo "Compiling raw application binary payload..."
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            PRODUCT_BUNDLE_IDENTIFIER="$LOCAL_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            clean build

          echo "Packaging raw binary payload into a deployment .ipa archive..."
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa/Payload"
          
          # Locates the compiled .app folder structure inside build outputs
          APP_FOLDER=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_FOLDER" ]; then
            echo "ERROR: Compiled application binary folder not found!"
            exit 1
          fi
          
          echo "Found compiled app structure at: $APP_FOLDER"
          cp -R "$APP_FOLDER" "$CM_BUILD_DIR/build/ios/ipa/Payload/"
          
          cd "$CM_BUILD_DIR/build/ios/ipa"
          zip -r "AridmansHappyPlace.ipa" Payload
          
          echo "Unsigned package successfully assembled for DNS sideloading!"
            
    artifacts:
      - build/ios/ipa/*.ipa

