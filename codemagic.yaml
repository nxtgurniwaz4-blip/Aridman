workflows:
  ios-native:
    name: Aridman’s Happy Place — iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "AridmansHappyPlace.xcodeproj"
        XCODE_SCHEME: "AridmansHappyPlace"
    scripts:
      - name: Extract App Source Folders
        script: |
          echo "Scanning directory to unpack your main app archive..."
          APP_ZIP=$(find "$CM_BUILD_DIR" -maxdepth 1 -name "Aridmans-Happy-Place*" | head -n 1)
          if [ -z "$APP_ZIP" ]; then
            echo "ERROR: Could not locate the app archive!"
            exit 1
          fi
          unzip -o "$APP_ZIP" "AridmansHappyPlace/*" -d "$CM_BUILD_DIR/"

      - name: Install project generator
        script: |
          echo "Configuring homebrew shell paths for Apple Silicon environment..."
          eval "$(/opt/homebrew/bin/brew shellenv)"
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          echo "Registering homebrew variables to locate binary tools..."
          eval "$(/opt/homebrew/bin/brew shellenv)"
          xcodegen generate --spec project.yml

      # --- FULLY AUTOMATED SYSTEM: Reads local password string dynamically ---
      - name: Build Signed IPA File
        script: |
          echo "Reading bundle identifier directly from profile.mobileprovision..."
          LOCAL_BUNDLE_ID=$(security cms -D -i "$CM_BUILD_DIR/profile.mobileprovision" | plutil -extract Entitlements.application-identifier xml1 -o - - | grep string | sed 's/^<string>[^\. ]*\.\(.*\)<\/string>$/\1/g' | xargs)
          echo "LOCAL BUNDLE ID INJECTED: $LOCAL_BUNDLE_ID"
          
          echo "Reading Development Team ID directly from profile.mobileprovision..."
          LOCAL_TEAM_ID=$(security cms -D -i "$CM_BUILD_DIR/profile.mobileprovision" | plutil -extract TeamIdentifier xml1 -o - - | grep string | sed -e 's/<[^>]*>//g' | xargs)
          echo "CLEANED LOCAL TEAM ID INJECTED: $LOCAL_TEAM_ID"
          
          echo "Extracting actual internal profile UUID..."
          LOCAL_UUID=$(UUID=$(grep -aA1 "UUID" "$CM_BUILD_DIR/profile.mobileprovision" | grep string | sed -e 's/<[^>]*>//g' | xargs); echo "$UUID")
          echo "DETECTED PROFILE UUID: $LOCAL_UUID"
          
          echo "Dynamically fetching the certificate password from password.txt..."
          if [ -f "$CM_BUILD_DIR/password.txt" ]; then
            DYNAMIC_PASSWORD=$(cat "$CM_BUILD_DIR/password.txt" | xargs)
            echo "Successfully loaded certificate password string."
          else
            echo "ERROR: password.txt not found in the repository!"
            exit 1
          fi
          
          if [ -z "$LOCAL_BUNDLE_ID" ] || [ -z "$LOCAL_TEAM_ID" ] || [ -z "$LOCAL_UUID" ]; then
            echo "ERROR: Failed to extract mandatory signing metadata from profile!"
            exit 1
          fi
          
          echo "Setting up temporary secure build keychain..."
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          
          echo "Importing certificate data dynamically..."
          security import "$CM_BUILD_DIR/cert.p12" \
            -k build.keychain \
            -P "$DYNAMIC_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
            
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          
          echo "Linking mobileprovision profile to system storage paths..."
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$CM_BUILD_DIR/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$LOCAL_UUID.mobileprovision"
          
          echo "Compiling workspace archive targeting iPhoneOS platform manually..."
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/Aridman.xcarchive" \
            DEVELOPMENT_TEAM="$LOCAL_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$LOCAL_BUNDLE_ID" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE="$LOCAL_UUID" \
            clean archive
          
          echo "Generating automated inline ExportOptions config template..."
          cat <<EOF > "$CM_BUILD_DIR/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
              <key>teamID</key>
              <string>$LOCAL_TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$LOCAL_BUNDLE_ID</key>
                  <string>$LOCAL_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF
          
          echo "Exporting compiled archive to direct standalone package..."
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/Aridman.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist"
            
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
