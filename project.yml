name: AridmansHappyPlace
options:
  bundleIdPrefix: com.aridman
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.aridman.happyplace
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    INFOPLIST_KEY_CFBundleDisplayName: "Aridman’s Happy Place"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  AridmansHappyPlace:
    type: application
    platform: iOS
    sources:
      - AridmansHappyPlace
    settings:
      base:
        PRODUCT_NAME: "Aridman’s Happy Place"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: AridmansHappyPlace/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
